<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepTrack - Workout Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>RepForge</h1>
        <p>Track your workouts. Track your progress.</p>
    </header>

    <main>

        <section class="workout-card">

            <h2>Add Workout</h2>

            <form id="workout-form">

                <label for="training-day">Training Day</label>
                <select id="training-day" required>
                    <option value="">Select a day</option>
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                    <option value="Saturday">Saturday</option>
                    <option value="Sunday">Sunday</option>
                </select>

                <label for="exercise-name">Exercise Name</label>
                <input
                    type="text"
                    id="exercise-name"
                    placeholder="Example: Bench Press"
                    required
                >

                <div class="input-row">

                    <div>
                        <label for="sets">Sets</label>
                        <input
                            type="number"
                            id="sets"
                            min="1"
                            placeholder="3"
                            required
                        >
                    </div>

                    <div>
                        <label for="reps">Reps</label>
                        <input
                            type="number"
                            id="reps"
                            min="1"
                            placeholder="8"
                            required
                        >
                    </div>

                    <div>
                        <label for="weight">Weight (LB)</label>
                        <input
                            type="number"
                            id="weight"
                            min="0"
                            step="0.5"
                            placeholder="175"
                            required
                        >
                    </div>

                </div>

                <div class="buttons">
                    <button type="submit" class="add-button">
                        Add Workout
                    </button>

                    <button type="button" id="clear-button" class="clear-button">
                        Clear
                    </button>
                </div>

            </form>

        </section>


        <section class="history-card">

            <h2>Workout History</h2>

            <div id="workout-history">

                <p id="empty-message">
                    No workouts recorded yet.
                </p>

            </div>

        </section>

    </main>

    <footer>
        <p>RepTrack &copy; 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
